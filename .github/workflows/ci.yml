name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build
        run: cmake --build build -j 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Cluster test
        run: OPS=20000 ./scripts/run_cluster_test.sh
